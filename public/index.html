
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rubik's Cube Solver</title>
  <style>
    body {
      font: 16px system-ui, sans-serif;
      max-width: 680px;
      margin: 30px auto;
      padding: 16px;
      background: #f3f5f7;
      color: #17202a;
    }

    main {
      background: white;
      padding: 24px;
      border-radius: 14px;
      text-align: center;
    }

    .palette {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin: 18px 0 28px;
    }

    .swatch {
      width: 46px;
      height: 46px;
      border: 3px solid #555;
      border-radius: 8px;
      cursor: pointer;
    }

    .swatch.selected {
      outline: 4px solid #111;
      outline-offset: 3px;
    }

    .cube {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      max-width: 430px;
      margin: 20px auto;
    }

    .face {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
      position: relative;
      padding-top: 22px;
    }

    .face::before {
      content: attr(data-face);
      position: absolute;
      top: 0;
      left: 0;
      font-weight: bold;
    }

    .U { grid-column: 2; grid-row: 1; }
    .L { grid-column: 1; grid-row: 2; }
    .F { grid-column: 2; grid-row: 2; }
    .R { grid-column: 3; grid-row: 2; }
    .B { grid-column: 4; grid-row: 2; }
    .D { grid-column: 2; grid-row: 3; }

    .sticker {
      aspect-ratio: 1;
      min-width: 0;
      border: 2px solid #222;
      border-radius: 5px;
      cursor: pointer;
    }

    .sticker:disabled {
      cursor: default;
      border-color: #777;
    }

    .action {
      padding: 10px 18px;
      margin: 5px;
      cursor: pointer;
    }

    #result {
      min-height: 2em;
      overflow-wrap: anywhere;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main>
    <h1>Rubik’s Cube Solver</h1>
    <p>Choose a color below, then click stickers to paint them.</p>

    <div id="palette" class="palette"></div>
    <div id="cube" class="cube"></div>

    <button class="action" id="solve">Solve</button>
    <button class="action" id="reset">Reset</button>

    <p id="result">Choose colors for your cube, then press Solve.</p>
  </main>

  <script>
    const faces = ["U", "R", "F", "D", "L", "B"];
    const displayOrder = ["U", "L", "F", "R", "B", "D"];

    const colors = {
      U: "#ffffff",
      R: "#e53935",
      F: "#20a44b",
      D: "#ffeb3b",
      L: "#ff8c00",
      B: "#2878d0"
    };

    const colorNames = {
      U: "White",
      R: "Red",
      F: "Green",
      D: "Yellow",
      L: "Orange",
      B: "Blue"
    };

    let cube;
    let selectedColor = "U";

    const palette = document.getElementById("palette");

    for (const face of faces) {
      const swatch = document.createElement("button");
      swatch.className = "swatch";
      swatch.style.backgroundColor = colors[face];
      swatch.title = `${colorNames[face]} (${face})`;
      swatch.setAttribute("aria-label", `Select ${colorNames[face]}`);

      swatch.addEventListener("click", () => {
        selectedColor = face;
        document.querySelectorAll(".swatch").forEach(item => {
          item.classList.remove("selected");
        });
        swatch.classList.add("selected");
      });

      palette.appendChild(swatch);
    }

    palette.firstElementChild.classList.add("selected");

    function showFacelets(facelets) {
  cube = Object.fromEntries(
    faces.map((face, i) => [
      face,
      facelets.slice(i * 9, i * 9 + 9).split("")
    ])
  );
  drawCube();
}
    
    function resetCube() {
      cube = Object.fromEntries(
        faces.map(face => [face, Array(9).fill(face)])
      );
      drawCube();
      document.getElementById("result").textContent =
        "Choose colors for your cube, then press Solve.";
    }

    function drawCube() {
      const container = document.getElementById("cube");
      container.replaceChildren();

      for (const face of displayOrder) {
        const faceElement = document.createElement("div");
        faceElement.className = `face ${face}`;
        faceElement.dataset.face = face;

        cube[face].forEach((colorFace, index) => {
          const sticker = document.createElement("button");
          sticker.className = "sticker";
          sticker.style.backgroundColor = colors[colorFace];
          sticker.setAttribute("aria-label", `${face} sticker ${index + 1}`);

          if (index === 4) {
            sticker.disabled = true;
          } else {
            sticker.addEventListener("click", () => {
              cube[face][index] = selectedColor;
              drawCube();
            });
          }

          faceElement.appendChild(sticker);
        });

        container.appendChild(faceElement);
      }
    }

    document.getElementById("reset").addEventListener("click", resetCube);

    document.getElementById("solve").addEventListener("click", async () => {
      const result = document.getElementById("result");
      result.textContent = "Solving…";

      const facelets = faces.map(face => cube[face].join("")).join("");

      try {
        const response = await fetch("/solve", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ facelets })
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Could not solve cube.");

      if (data.steps.length === 0) {
  result.textContent = "Cube is already solved!";
  return;
}

for (let i = 0; i < data.steps.length; i++) {
  const step = data.steps[i];
  showFacelets(step.facelets);
  result.textContent =
    `Move ${i + 1} of ${data.steps.length}: ${step.move}`;

  await new Promise(resolve => setTimeout(resolve, 700));
}

result.textContent = `Solved! Moves: ${data.solution}`;
      }
    });

    resetCube();
  </script>
</body>
</html>
