<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rubik's Cube Solver</title>
  <style>
    body {
      font: 16px system-ui, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 16px;
      background: #f4f6f8;
      color: #17202a;
    }
    main {
      background: white;
      padding: 24px;
      border-radius: 12px;
    }
    textarea {
      box-sizing: border-box;
      width: 100%;
      min-height: 120px;
      padding: 12px;
      font: 16px monospace;
    }
    button {
      margin: 12px 8px 12px 0;
      padding: 10px 16px;
      cursor: pointer;
    }
    #result {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main>
    <h1>Rubik’s Cube Solver</h1>
    <p>
      Enter 54 face letters in this order:
      <code>U R F D L B</code>, nine stickers per face.
    </p>

    <label for="facelets">Cube state</label>
    <textarea id="facelets" placeholder="54 letters: U, R, F, D, L, B"></textarea>

    <br>
    <button id="solve">Solve cube</button>
    <button id="example" type="button">Load solved example</button>

    <h2>Solution</h2>
    <p id="result">Your solution will appear here.</p>
  </main>

  <script>
    const input = document.getElementById("facelets");
    const result = document.getElementById("result");

    document.getElementById("example").addEventListener("click", () => {
      input.value =
        "UUUUUUUUU" +
        "RRRRRRRRR" +
        "FFFFFFFFF" +
        "DDDDDDDDD" +
        "LLLLLLLLL" +
        "BBBBBBBBB";
    });

    document.getElementById("solve").addEventListener("click", async () => {
      result.textContent = "Solving…";

      try {
        const response = await fetch("/solve", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ facelets: input.value })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Could not solve this cube.");
        }

        result.textContent = data.solution;
      } catch (error) {
        result.textContent = `Error: ${error.message}`;
      }
    });
  </script>
</body>
</html>
